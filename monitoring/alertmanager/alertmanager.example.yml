route:
  receiver: "null"
  group_by: ["alertname", "namespace"]
  group_wait: 0s
  group_interval: 30s
  repeat_interval: 5m
  routes:
    - receiver: "steering-handler"
      matchers:
        - alertname=~"SteeringTrigger|SteeringRecover"
      continue: false
    - receiver: "burst-handler"
      matchers:
        - alertname=~"BurstTrigger|BurstRecover"
      continue: false

receivers:
  - name: "null"

  - name: "steering-handler"
    webhook_configs:
      - url: "https://steering-lambda-url.example/"
        send_resolved: false
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/secrets/webhook-token

  - name: "burst-handler"
    webhook_configs:
      - url: "https://burst-lambda-url.example/"
        send_resolved: false
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/secrets/webhook-token
