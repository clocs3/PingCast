apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy-agent
  namespace: ns-observability-onprem
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy-agent-read-onprem
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "nodes/metrics", "pods", "pods/log", "services", "endpoints", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy-agent-read-onprem
subjects:
  - kind: ServiceAccount
    name: alloy-agent
    namespace: ns-observability-onprem
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy-agent-read-onprem
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-agent-config
  namespace: ns-observability-onprem
data:
  config.alloy: |
    logging {
      level  = "info"
      format = "logfmt"
    }

    prometheus.remote_write "default" {
      external_labels = {
        cluster = env("CLUSTER_NAME"),
      }

      endpoint {
        url = env("PROM_REMOTE_WRITE_URL")
      }
    }

    discovery.kubernetes "nodes" {
      role = "node"
    }

    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "kubelet" {
      targets = discovery.kubernetes.nodes.targets

      rule {
        target_label = "__address__"
        replacement  = "kubernetes.default.svc:443"
      }

      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "__metrics_path__"
        replacement   = "/api/v1/nodes/$1/proxy/metrics"
      }

      rule {
        target_label = "job"
        replacement  = "kubelet"
      }

      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "instance"
      }
    }

    prometheus.scrape "kubelet" {
      targets = discovery.relabel.kubelet.output
      scheme  = "https"

      tls_config {
        ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
      }

      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      forward_to        = [prometheus.remote_write.default.receiver]
    }

    discovery.relabel "cadvisor" {
      targets = discovery.kubernetes.nodes.targets

      rule {
        target_label = "__address__"
        replacement  = "kubernetes.default.svc:443"
      }

      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "__metrics_path__"
        replacement   = "/api/v1/nodes/$1/proxy/metrics/cadvisor"
      }

      rule {
        target_label = "job"
        replacement  = "cadvisor"
      }

      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "instance"
      }
    }

    prometheus.scrape "cadvisor" {
      targets = discovery.relabel.cadvisor.output
      scheme  = "https"

      tls_config {
        ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
      }

      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      forward_to        = [prometheus.remote_write.default.receiver]
    }

    discovery.relabel "ns_media_pod_metrics" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        regex         = "ns-media-onprem"
        action        = "keep"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
        regex         = "true"
        action        = "keep"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scheme"]
        target_label  = "__scheme__"
        regex         = "(https?)"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
        target_label  = "__metrics_path__"
        regex         = "(.+)"
      }

      rule {
        source_labels = ["__address__", "__meta_kubernetes_pod_annotation_prometheus_io_port"]
        target_label  = "__address__"
        regex         = "([^:]+)(?::\\d+)?;(\\d+)"
        replacement   = "$1:$2"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "app"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      rule {
        target_label = "job"
        replacement  = "k8s-pods"
      }
    }

    prometheus.scrape "ns_media_pod_metrics" {
      targets    = discovery.relabel.ns_media_pod_metrics.output
      forward_to = [prometheus.remote_write.default.receiver]
    }

    loki.write "default" {
      endpoint {
        url = env("LOKI_WRITE_URL")
      }
      external_labels = {
        cluster = env("CLUSTER_NAME"),
      }
    }

    discovery.relabel "media_pods_logs" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        regex         = "ns-media-onprem"
        action        = "keep"
      }

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "app"
      }
    }

    loki.source.kubernetes "media_pods" {
      targets    = discovery.relabel.media_pods_logs.output
      forward_to = [loki.write.default.receiver]
    }

    otelcol.receiver.otlp "otlp" {
      grpc {
        endpoint = "0.0.0.0:4317"
      }
      http {
        endpoint = "0.0.0.0:4318"
      }

      output {
        traces = [otelcol.processor.batch.default.input]
      }
    }

    otelcol.processor.batch "default" {
      output {
        traces = [otelcol.exporter.otlp.tempo.input]
      }
    }

    otelcol.exporter.otlp "tempo" {
      client {
        endpoint = env("TEMPO_OTLP_ENDPOINT")
        tls {
          insecure = true
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy-agent
  namespace: ns-observability-onprem
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alloy-agent
  template:
    metadata:
      labels:
        app: alloy-agent
    spec:
      serviceAccountName: alloy-agent
      containers:
        - name: alloy
          image: grafana/alloy:v1.13.0
          args:
            - run
            - /etc/alloy/config.alloy
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy/data
          env:
            - name: CLUSTER_NAME
              value: onprem
            - name: PROM_REMOTE_WRITE_URL
              value: http://observability-gateway.internal.example:9090/api/v1/metrics/write
            - name: LOKI_WRITE_URL
              value: http://observability-gateway.internal.example:3100/loki/api/v1/push
            - name: TEMPO_OTLP_ENDPOINT
              value: observability-gateway.internal.example:4317
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: http
              containerPort: 12345
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
              readOnly: true
            - name: storage
              mountPath: /var/lib/alloy/data
      volumes:
        - name: config
          configMap:
            name: alloy-agent-config
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alloy-agent
  namespace: ns-observability-onprem
spec:
  selector:
    app: alloy-agent
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: http
      port: 12345
      targetPort: 12345
