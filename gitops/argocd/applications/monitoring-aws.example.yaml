apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pingcast-monitoring-dev
  namespace: argocd
spec:
  project: pingcast
  source:
    repoURL: ssh://git@gitlab.example.com:2222/pingcast/deploy-vpc1.git
    targetRevision: main
    path: apps/pingcast/monitoring/overlays
  destination:
    server: https://kubernetes.default.svc
    namespace: ns-observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
