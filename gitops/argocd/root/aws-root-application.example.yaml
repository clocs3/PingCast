apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pingcast-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ssh://git@gitlab.example.com:2222/pingcast/deploy-vpc1.git
    targetRevision: main
    path: argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
