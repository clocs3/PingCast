apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  role: KarpenterNodeRole-example
  amiSelectorTerms:
    - alias: al2023@v20240424
  subnetSelectorTerms:
    - id: subnet-example-a
    - id: subnet-example-b
  securityGroupSelectorTerms:
    - id: sg-example
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required
  tags:
    Name: example-karpenter-node
    karpenter.sh/discovery: example-eks-cluster
    example.com/managed-by: karpenter
