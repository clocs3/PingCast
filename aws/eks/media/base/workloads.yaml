apiVersion: v1
kind: ServiceAccount
metadata:
  name: stream-controller
  namespace: ns-media
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/pingcast-media-s3-irsa-role
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: stream-controller-job-manager
  namespace: ns-media
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: stream-controller-job-manager
  namespace: ns-media
subjects:
  - kind: ServiceAccount
    name: stream-controller
    namespace: ns-media
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: stream-controller-job-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-controller
  namespace: ns-media
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stream-controller
  template:
    metadata:
      labels:
        app: stream-controller
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      terminationGracePeriodSeconds: 30
      serviceAccountName: stream-controller
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: stream-controller
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: stream-controller
      imagePullSecrets:
        - name: harbor-creds
      containers:
        - name: stream-controller
          image: registry.example.com/pingcast/stream-controller-aws:example
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: media-runtime-secrets
                  key: redis-url
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: media-runtime-secrets
                  key: postgres-url
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: media-runtime-secrets
                  key: mongo-uri
            - name: MONGO_DB_NAME
              value: streaming
            - name: MONGO_COLLECTION_VOD
              value: user_vods
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: FFMPEG_IMAGE
              value: registry.example.com/pingcast/ffmpeg-hls-aws:7585afb35cb2
            - name: FFMPEG_SIDECAR_IMAGE
              value: registry.example.com/pingcast/s3-uploader:ea67dde5db50
            - name: FFMPEG_PULL_POLICY
              value: Always
            - name: FFMPEG_IMAGE_PULL_SECRET
              value: harbor-creds
            - name: FFMPEG_NODE_SELECTOR_KEY
              value: workload
            - name: FFMPEG_NODE_SELECTOR_VALUE
              value: ffmpeg
            - name: FFMPEG_NODE_TAINT_KEY
              value: workload
            - name: FFMPEG_NODE_TAINT_VALUE
              value: ffmpeg
            - name: FFMPEG_NODE_TAINT_EFFECT
              value: NoSchedule
            - name: FFMPEG_SERVICE_ACCOUNT_NAME
              value: stream-controller
            - name: RTMP_HOST
              value: nginx-rtmp.ns-media.svc.cluster.local
            - name: RTMP_PORT
              value: "1935"
            - name: RTMP_APP
              value: live
            - name: HLS_PVC_NAME
              value: ""
            - name: HLS_HOST_PATH
              value: ""
            - name: DISCONNECT_GRACE_SECONDS
              value: "10"
            - name: HLS_CLEANUP_ON_START
              value: "true"
            - name: HLS_CLEANUP_ON_EXIT
              value: "true"
            - name: OBJECT_STORAGE_PROVIDER
              value: s3
            - name: OBJECT_STORAGE_BUCKET
              value: pingcast-media-archive-example
            - name: OBJECT_STORAGE_PREFIX
              value: hls
            - name: AWS_REGION
              value: ap-northeast-2
            - name: UPLOAD_POLL_SECONDS
              value: "2"
            - name: SIDECAR_IDLE_EXIT_SECONDS
              value: "45"
            - name: UPLOAD_WORKERS
              value: "4"
            - name: OTEL_SERVICE_NAME
              value: stream-controller
            - name: OTEL_ENV
              value: prod
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy-agent.ns-observability.svc.cluster.local:4318
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: stream-controller
  namespace: ns-media
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: stream-controller
---
apiVersion: v1
kind: Service
metadata:
  name: stream-controller
  namespace: ns-media
spec:
  selector:
    app: stream-controller
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-rtmp
  namespace: ns-media
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-rtmp
  template:
    metadata:
      labels:
        app: nginx-rtmp
    spec:
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: nginx-rtmp
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: nginx-rtmp
      imagePullSecrets:
        - name: harbor-creds
      containers:
        - name: nginx-rtmp
          image: registry.example.com/pingcast/nginx-rtmp-aws:example
          imagePullPolicy: Always
          ports:
            - containerPort: 1935
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nginx-rtmp
  namespace: ns-media
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: nginx-rtmp
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-rtmp
  namespace: ns-media
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
  labels:
    expose: rtmp
spec:
  type: LoadBalancer
  selector:
    app: nginx-rtmp
  ports:
    - name: rtmp
      port: 1935
      targetPort: 1935
